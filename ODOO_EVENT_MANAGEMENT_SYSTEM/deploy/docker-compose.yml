services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ems_odoo_db:/var/lib/postgresql/data
    networks: [ems_odoo_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ems_odoo_data:/var/lib/odoo
      - ../addons:/mnt/extra-addons:ro
      - ./generated/odoo.conf:/etc/odoo/odoo.conf:ro
    ports:
      - "127.0.0.1:${ODOO_PORT}:8069"
    networks: [ems_odoo_internal]

networks:
  ems_odoo_internal:
    driver: bridge

volumes:
  ems_odoo_db:
  ems_odoo_data:
